<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物體集參數與層級編輯台</title>
<style>
:root{
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
  --bg:#0F1317; --panel:#151B21; --panel2:#1B242C; --line:#26323C;
  --ink:#DDE6EC; --dim:#8397A4; --faint:#5B6B78;
  --amber:#E9A13B; --cyan:#5FB4D2; --bad:#D9634F; --ok:#6FBF8E;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased}
.wrap{display:grid; grid-template-columns:172px 1fr 420px; height:100vh; overflow:hidden}

.rail{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:14px 0}
.rail h1{font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--faint); margin:0 0 10px; padding:0 16px; font-weight:600}
.cls{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 16px; background:none; border:0; color:var(--dim);
  font-family:var(--sans); font-size:13px; cursor:pointer; border-left:2px solid transparent}
.cls:hover{color:var(--ink); background:var(--panel2)}
.cls[aria-current="true"]{color:var(--ink); border-left-color:var(--amber); background:var(--panel2)}
.cls .fam{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint)}
.railsec{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
  padding:14px 16px 5px; font-weight:600}

.view{position:relative; display:flex; flex-direction:column; min-width:0}
.stage{flex:1; position:relative; min-height:0}
#cv{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
#cv:active{cursor:grabbing}
.badge{position:absolute; top:14px; left:16px; font-family:var(--mono); font-size:11px;
  color:var(--dim); letter-spacing:.06em}
.badge b{color:var(--ink); font-weight:600; letter-spacing:.02em}
.hint{position:absolute; bottom:12px; left:16px; font-size:11px; color:var(--faint)}
.flag{position:absolute; top:14px; right:16px; font-family:var(--mono); font-size:11px;
  padding:3px 8px; border-radius:2px; display:none}
.flag.on{display:block}
.flag.warn{background:rgba(217,99,79,.16); color:var(--bad); border:1px solid rgba(217,99,79,.4)}
.strip{border-top:1px solid var(--line); background:var(--panel);
  display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); font-family:var(--mono)}
.cell{padding:8px 12px; border-right:1px solid var(--line)}
.cell:last-child{border-right:0}
.cell .k{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.cell .v{font-size:14px; color:var(--ink); margin-top:1px}
.cell .v.warn{color:var(--bad)} .cell .v.ok{color:var(--ok)}

.panel{background:var(--panel); border-left:1px solid var(--line); overflow:hidden;
  padding:0; display:flex; flex-direction:column; min-height:0}
.ptop{padding:14px 18px 0; flex:none}
.tabs{flex:none}
.phead{display:flex; align-items:baseline; gap:8px}
.phead h2{font-size:17px; margin:0; font-weight:600}
.phead span{font-family:var(--mono); font-size:11px; color:var(--faint)}
.pdesc{color:var(--dim); font-size:12px; margin:2px 0 12px}
.tabs{display:flex; gap:0; border-bottom:1px solid var(--line); padding:0 18px}
.tabs button{background:none; border:0; border-bottom:2px solid transparent; color:var(--faint);
  font-family:var(--sans); font-size:12.5px; padding:7px 12px; cursor:pointer; margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--amber); border-bottom-color:var(--amber)}
.tabbody{padding:14px 18px 60px; flex:1 1 auto; min-height:0; overflow-y:scroll;
  overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--faint) transparent}
.tabbody[hidden]{display:none}
.tabbody::-webkit-scrollbar{width:9px}
.tabbody::-webkit-scrollbar-track{background:transparent}
.tabbody::-webkit-scrollbar-thumb{background:var(--faint); border-radius:5px;
  border:2px solid var(--panel)}
.tabbody::-webkit-scrollbar-thumb:hover{background:var(--faint)}

.grp{margin-bottom:16px}
.glab{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
  margin-bottom:8px; font-weight:600}
.sl{margin-bottom:10px}
.slrow{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px}
.slrow .n{font-size:12px; color:var(--dim); flex:1}
.slrow .n em{font-style:normal; color:var(--faint); font-size:11px; margin-left:5px}
.slrow .fixmark{font-family:var(--mono); font-size:9.5px; color:var(--faint);
  border:1px solid var(--line); padding:0 4px; border-radius:2px}
input[type=number]{
  width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:2px;
  color:var(--amber); font-family:var(--mono); font-size:12px; padding:3px 6px; text-align:right}
input[type=number]:focus{outline:none; border-color:var(--cyan)}
input[type=text].lv{
  width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:2px;
  color:var(--ink); font-family:var(--mono); font-size:11.5px; padding:3px 6px}
input[type=text].lv:focus{outline:none; border-color:var(--cyan)}
input[type=range]{width:100%; -webkit-appearance:none; appearance:none; height:3px;
  border-radius:2px; background:var(--line); outline:none; margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px;
  border-radius:50%; background:var(--amber); cursor:pointer; border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%;
  background:var(--amber); cursor:pointer; border:2px solid var(--panel)}
input[type=range]:focus-visible{outline:2px solid var(--cyan); outline-offset:3px}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chips button{font-family:var(--mono); font-size:11.5px; padding:4px 9px; border-radius:2px;
  background:var(--panel2); border:1px solid var(--line); color:var(--dim); cursor:pointer}
.chips button:hover{color:var(--ink); border-color:var(--faint)}
.chips button[aria-pressed="true"]{background:var(--amber); border-color:var(--amber); color:#12171B}
.note{font-size:11px; color:var(--faint); margin:6px 0 0; line-height:1.5}
.acts{display:flex; gap:7px; margin:14px 0}
.acts button{flex:1; padding:8px 0; border-radius:2px; font-family:var(--sans); font-size:12.5px;
  cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--dim)}
.acts button:hover{color:var(--ink)}
.acts .prim{background:var(--amber); border-color:var(--amber); color:#12171B; font-weight:600}
.acts .prim:hover{color:#12171B; filter:brightness(1.08)}

/* level editor */
.ax{border:1px solid var(--line); border-radius:3px; margin-bottom:12px; overflow:hidden}
.axhd{display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel2)}
.axhd .nm{font-size:12.5px; color:var(--ink); font-weight:600}
.axhd .ty{font-family:var(--mono); font-size:10px; color:var(--faint); margin-left:auto}
.axhd .rt{font-family:var(--mono); font-size:11px; color:var(--amber)}
.axbd{padding:8px 10px}
.lvrow{display:grid; grid-template-columns:26px 1fr; gap:8px; align-items:start; margin-bottom:6px}
.lvrow:last-child{margin-bottom:0}
.lvtag{font-family:var(--mono); font-size:11px; color:var(--faint); padding-top:4px}
.pair{display:grid; grid-template-columns:auto 1fr auto 1fr; gap:5px; align-items:center; margin-bottom:4px}
.pair:last-child{margin-bottom:0}
.pair .side{font-family:var(--mono); font-size:10px; color:var(--faint); white-space:nowrap}
.single{display:grid; grid-template-columns:1fr auto 1fr; gap:5px; align-items:center}
.single{grid-template-columns:1fr auto 1fr auto}
.single .dash{color:var(--faint); font-family:var(--mono); font-size:11px}
.single .offtag{font-family:var(--mono); font-size:9.5px; color:var(--faint);
  border:1px solid var(--line); padding:0 4px; border-radius:2px; white-space:nowrap}
.single.off input.lv{color:var(--faint); background:transparent; border-style:dashed}
.allow{display:flex; gap:5px; align-items:center}
.tot{font-family:var(--mono); font-size:11px; color:var(--dim); padding:8px 10px;
  border:1px solid var(--line); border-radius:3px; background:var(--panel2); margin-bottom:12px}
.tot b{color:var(--amber)}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--amber); color:#12171B; font-size:12.5px; font-weight:600;
  padding:8px 18px; border-radius:2px; opacity:0; pointer-events:none; transition:opacity .18s}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">

  <nav class="rail">
    <h1>類別</h1>
    <div id="rail"></div>
    <div class="railsec">顯示</div>
    <div style="padding:2px 16px 0">
      <div class="chips" id="viewopt"><button data-k="cont" aria-pressed="false">容器框</button><button data-k="spin" aria-pressed="false">自轉</button></div>
    </div>
  </nav>

  <main class="view">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="badge" id="badge"></div>
      <div class="flag warn" id="flag"></div>
      <div class="hint">拖曳旋轉</div>
    </div>
    <div class="strip" id="strip"></div>
  </main>

  <aside class="panel">
    <div class="ptop">
      <div class="phead"><h2 id="ptitle"></h2><span id="pfam"></span></div>
      <p class="pdesc" id="pdesc"></p>
    </div>
    <div class="tabs">
      <button id="tab1" aria-selected="true">調參數</button>
      <button id="tab2" aria-selected="false">層級</button>
    </div>
    <div class="tabbody" id="body1"></div>
    <div class="tabbody" id="body2" hidden></div>
  </aside>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var S = {
  fam:"frustum",
  n:4, top:1, waist:1, wpos:0.5, wfrac:0.15,
  hole:0.5, depth:1,
  sk:5, rin:0.5,
  neck:0.5, necklen:0.4,
  ts:0.35, ta:0.35, u:0, p:0,
  nstep:3,
  rx:1, ry:1, rz:1,
  cube:15, container:80, minfeat:2.5,
  dens:1.25
};
var showCont = false;
var autoSpin = false;   // 自轉預設關閉
var reduceMotion = true;

/* ============ geometry core (verbatim from index.html) ============ */
/*
   Y. A cross-section is a list of [x,z] wound counter-clockwise, matching the
   increasing-angle polygon the original prism used, so the face winding below
   keeps the Newell normal pointing into the material for all families. */

function shoelace(poly){
  var A=0,i,n=poly.length;
  for(i=0;i<n;i++){ var a=poly[i], b=poly[(i+1)%n]; A += a[0]*b[1]-b[0]*a[1]; }
  return A/2;
}
// drop repeated and collinear vertices: the branch generator emits a fixed
// 12-point outline whose corners collapse for the L / T / flush cases
function cleanPoly(poly){
  var out=[],i,n=poly.length;
  for(i=0;i<n;i++){
    var a=poly[i], b=poly[(i+1)%n];
    if(Math.abs(a[0]-b[0])<1e-9 && Math.abs(a[1]-b[1])<1e-9) continue;
    out.push(a);
  }
  var res=[], m=out.length;
  if(m<3) return poly;
  for(i=0;i<m;i++){
    var pr=out[(i-1+m)%m], cu=out[i], nx=out[(i+1)%m];
    var cr=(cu[0]-pr[0])*(nx[1]-pr[1])-(cu[1]-pr[1])*(nx[0]-pr[0]);
    if(Math.abs(cr)<1e-12) continue;
    res.push(cu);
  }
  return res.length>=3 ? res : out;
}
function orient(poly){ return shoelace(poly)<0 ? poly.slice().reverse() : poly; }

/* ---- cross-sections ---- */
function polyNgon(){
  var N=(S.n==="circle")?72:parseInt(S.n,10);
  var off=Math.PI/N, poly=[], k;
  for(k=0;k<N;k++){ var a=off+2*Math.PI*k/N; poly.push([0.5*Math.cos(a), 0.5*Math.sin(a)]); }
  return poly;
}
function polyStar(){
  var K=starPoints(), ri=starInner();
  var poly=[], j;
  for(j=0;j<2*K;j++){
    var a=Math.PI/(2*K) + Math.PI*j/K;
    var R=(j%2===0)?0.5:0.5*ri;
    poly.push([R*Math.cos(a), R*Math.sin(a)]);
  }
  return poly;
}
/* stem spans the full Z of the unit square, arm spans the full X, so the union
   always touches all four sides and the bbox is exactly the unit square */
function polyBranch(){
  var ts=branchTs(), ta=branchTa(), uu=branchU(), pp=branchP();
  var cx=(-0.5+ts/2)*(1-2*uu), cz=(-0.5+ta/2)*(1-2*pp);
  var x0=cx-ts/2, x1=cx+ts/2, z0=cz-ta/2, z1=cz+ta/2;
  var e=1e-9, poly=[];
  poly.push([x0,-0.5]); poly.push([x1,-0.5]); poly.push([x1,z0]);
  if(x1 < 0.5-e){ poly.push([0.5,z0]); poly.push([0.5,z1]); poly.push([x1,z1]); }
  poly.push([x1,0.5]); poly.push([x0,0.5]); poly.push([x0,z1]);
  if(x0 > -0.5+e){ poly.push([-0.5,z1]); poly.push([-0.5,z0]); poly.push([x0,z0]); }
  return poly;
}
/* equal-tread staircase: n=2 reduces exactly to the branch L, so the two
   families meet at that point instead of sitting on separate islands */
function polyStair(){
  var n=stairSteps();
  var w=1/n, hh=1/n, poly=[], i;
  poly.push([-0.5,-0.5]); poly.push([0.5,-0.5]);
  for(i=1;i<n;i++){
    var z=-0.5+i*hh;
    poly.push([-0.5+(n-i+1)*w, z]);
    poly.push([-0.5+(n-i)*w,   z]);
  }
  poly.push([-0.5+w, 0.5]); poly.push([-0.5, 0.5]);
  return poly;
}

/* ---- sweep ---- */
/* levels run bottom to top; s scales the cross-section. Face winding copies the
   original prism exactly: bottom cap reversed, top cap forward, sides
   [k, k2, up_k2, up_k]. */
function extrudeLevels(poly, levels){
  var verts=[], faces=[], N=poly.length, i, k;
  for(i=0;i<levels.length;i++){
    var s=levels[i].s;
    for(k=0;k<N;k++) verts.push([poly[k][0]*s, levels[i].y, poly[k][1]*s]);
  }
  var bot=[]; for(k=N-1;k>=0;k--) bot.push(k); faces.push(bot);
  var base=(levels.length-1)*N, top=[]; for(k=0;k<N;k++) top.push(base+k); faces.push(top);
  // every level shares one cross-section orientation, so the side faces are
  // planar quads and the volume solve and the STL see the same solid
  for(i=0;i<levels.length-1;i++){
    var b0=i*N, b1=(i+1)*N;
    for(k=0;k<N;k++){ var k2=(k+1)%N; faces.push([b0+k, b0+k2, b1+k2, b1+k]); }
  }
  return {verts:verts, faces:faces};
}
// exact volume of the swept solid, from the shoelace area of the section.
// Independent of the tetra-fan sum below, so the two are a real cross-check.
function sweptVolume(poly, levels){
  var A=Math.abs(shoelace(poly)), V=0, i;
  for(i=0;i<levels.length-1;i++){
    var h=levels[i+1].y-levels[i].y, s0=levels[i].s, s1=levels[i+1].s;
    V += A*h*(s0*s0+s0*s1+s1*s1)/3;
  }
  return V;
}
/* One clamped accessor per parameter. The builders clamp defensively before
   constructing geometry, so anything reading raw state sees a different shape
   from the one that actually gets built. That mattered little while thinnest()
   was advisory; now that it drives the L floor, a mismatch either lets an
   unprintable shape through or forces a shape larger than it needs to be.
   Every consumer must go through these, never through S directly. */
function taper(){ return Math.min(2.5, Math.max(0, S.top)); }
function boreRatio(){ return Math.min(0.95, Math.max(0.02, S.hole)); }
function boreDepthRaw(){ return Math.min(1, Math.max(0.02, S.depth)); }
function boreThrough(){ return boreDepthRaw() >= 0.999; }
function boreDepth(){ return boreThrough() ? 1 : boreDepthRaw(); }   // snapped
function starPoints(){ return Math.max(3, Math.min(12, Math.round(S.sk))); }
function starInner(){ return Math.min(1, Math.max(0.1, S.rin)); }
function neckRatio(){ return Math.min(0.98, Math.max(0.1, S.neck)); }
function neckHalf(){ return Math.min(0.45, Math.max(0.05, S.necklen/2)); }
function branchTs(){ return Math.min(0.9, Math.max(0.05, S.ts)); }
function branchTa(){ return Math.min(0.9, Math.max(0.05, S.ta)); }
function branchU(){ return Math.min(0.5, Math.max(0, S.u)); }
function branchP(){ return Math.min(0.5, Math.max(0, S.p)); }
function stairSteps(){ return Math.max(2, Math.min(8, Math.round(S.nstep))); }
/* Lower bound on the waist, so the generator cannot emit a neck too thin to
   print in one piece. Expressed against the narrower end face: the less mass
   sits above the waist, the thinner it is allowed to be, which is why a shape
   tapering to a point may keep a slender waist while a straight cylinder may
   not. Closed form, so no search is needed. */
var WAIST_REF_FLOOR = 0.30;   // see note below
function waistFloor(){
  var t=taper(), h=waistPos(), lin=1+(t-1)*h;
  if(lin<=1e-9) return 0.02;
  // The reference is the narrower end face, but a shape tapering to a point has
  // no narrower face and the rule would go vacuous exactly where the waist is
  // most fragile. Floor the reference so it stays meaningful there. 0.30 is
  // empirical, not derived: it is the smallest value that leaves no parameter
  // combination which is simultaneously unprintable and container-feasible,
  // across the swept grid. It only binds for top < 0.30; everything blunter is
  // governed by the end face itself.
  var ref = Math.max(Math.min(1, t), WAIST_REF_FLOOR);
  return Math.min(1, Math.max(0.02, Math.max(0,S.wfrac)*ref/lin));
}
function waistRatio(){ return Math.min(2.5, Math.max(waistFloor(), S.waist)); }
function waistPos(){ return Math.min(1, Math.max(0, S.wpos)); }
function waistInterior(){ var h=waistPos(); return h>1e-9 && h<1-1e-9; }
function hasWaist(){ return Math.abs(waistRatio()-1) > 1e-9; }

/* Cross-section scale along the sweep. The profile is two straight segments
   meeting at height h, where the scale is the linear value times m. At m=1 both
   segments collapse onto the single straight line of a plain frustum, so the
   waist adds a shape axis without splitting the family into two. */
function waistScale(){ var t=taper(), h=waistPos(); return waistRatio()*(1+(t-1)*h); }
function profileScale(y){
  var t=taper(), h=waistPos(), f=y+0.5, sw=waistScale();
  // At h=0 or h=1 the kink sits on an end face, so the body is a single segment
  // running from that face's scale to the other end. Taking the limit this way
  // avoids leaving a near-zero-height stub that reads as an almost-flat ledge.
  if(h<=1e-9)   return sw + (t-sw)*f;
  if(h>=1-1e-9) return 1  + (sw-1)*f;
  if(f<=h) return 1 + (sw-1)*(f/h);
  return sw + (t-sw)*((f-h)/(1-h));
}
// the profile is piecewise linear, so its extremes sit on the breakpoints
function profileExtremes(){
  var a=profileScale(-0.5), b=profileScale(0.5), c=profileScale(-0.5+waistPos());
  return [Math.min(a,b,c), Math.max(a,b,c)];
}
/* sweep heights: the two end faces, plus the waist and any extra height forced
   onto a level so the piecewise profile stays exact */
function profileLevels(extra){
  var ys=[-0.5, 0.5], i, j;
  var add=[];
  if(hasWaist() && waistInterior()) add.push(-0.5+waistPos());
  if(extra!==undefined && extra!==null) add.push(extra);
  for(j=0;j<add.length;j++){
    var y=add[j], snap=false;
    for(i=0;i<ys.length;i++) if(Math.abs(ys[i]-y)<1e-6){ add[j]=ys[i]; snap=true; break; }
    if(!snap) ys.push(y);
  }
  ys.sort(function(a,b){return a-b;});
  return {ys:ys, snapped:add};
}

/* ---- families ---- */
function buildFrustum(){
  var poly=orient(cleanPoly(polyNgon()));
  var ys=profileLevels().ys, levels=[], i;
  for(i=0;i<ys.length;i++) levels.push({y:ys[i], s:profileScale(ys[i])});
  var g=extrudeLevels(poly, levels);
  g.Vana=sweptVolume(poly, levels);
  return g;
}
function buildPrismatic(poly){
  poly=orient(cleanPoly(poly));
  var levels=[{y:-0.5,s:1},{y:0.5,s:1}];
  var g=extrudeLevels(poly, levels);
  g.Vana=sweptVolume(poly, levels);
  return g;
}
function buildDumbbell(){
  var poly=orient(cleanPoly(polyNgon()));
  var nk=neckRatio(), nh=neckHalf();
  var levels=[{y:-0.5,s:1},{y:-nh,s:1},{y:-nh,s:nk},{y:nh,s:nk},{y:nh,s:1},{y:0.5,s:1}];
  var g=extrudeLevels(poly, levels);
  g.Vana=sweptVolume(poly, levels);
  // the step from neck out to each end bulge is a 90 degree annular overhang,
  // unprintable in any orientation, so this family is exported cut into three
  g.meta={kind:"dumbbell", n:poly.length, levels:levels.length};
  return g;
}
/* Tube family: straight walls, no taper. q is the bore ratio and d
   the bore depth as a fraction of the height, measured down from the top face.
   d=1 is a through bore (a ring), d<1 leaves a floor (a cup), d->0 returns to a
   solid prism. */
function buildRingCup(){
  var poly=orient(cleanPoly(polyNgon()));
  var q=boreRatio(), d=boreDepth(), through=boreThrough();
  var N=poly.length, verts=[], faces=[], k;
  var yb=-0.5, yt=0.5, yf=through?yb:(0.5-d);
  for(k=0;k<N;k++) verts.push([poly[k][0],   yb, poly[k][1]]);        // 0    outer bottom
  for(k=0;k<N;k++) verts.push([poly[k][0],   yt, poly[k][1]]);        // N    outer top
  for(k=0;k<N;k++) verts.push([poly[k][0]*q, yf, poly[k][1]*q]);      // 2N   bore floor
  for(k=0;k<N;k++) verts.push([poly[k][0]*q, yt, poly[k][1]*q]);      // 3N   bore top
  for(k=0;k<N;k++){
    var k2=(k+1)%N;
    faces.push([k, k2, N+k2, N+k]);                                   // outer wall
    faces.push([3*N+k, 3*N+k2, 2*N+k2, 2*N+k]);                       // bore wall
    faces.push([N+k, N+k2, 3*N+k2, 3*N+k]);                           // top annulus
    if(through) faces.push([k2, k, 2*N+k, 2*N+k2]);                    // bottom annulus
  }
  if(!through){
    var bc=[]; for(k=N-1;k>=0;k--) bc.push(k);      faces.push(bc);   // full bottom
    var fc=[]; for(k=0;k<N;k++)    fc.push(2*N+k);  faces.push(fc);   // bore floor
  }
  var A=Math.abs(shoelace(poly));
  // the bore floor is snapped to the base once d crosses the through threshold,
  // so the analytic volume must use the snapped depth too, not the raw d, or the
  // cross-check disagrees with a mesh that is itself correct
  return {verts:verts, faces:faces, Vana:A - A*q*q*d};   // d is already snapped
}
function buildSphere(){
  var LAT=28, LON=56, R=0.5, verts=[], faces=[], i, j;
  for(i=0;i<=LAT;i++){
    var th=Math.PI*i/LAT;
    for(j=0;j<LON;j++){
      var ph=2*Math.PI*j/LON;
      verts.push([R*Math.sin(th)*Math.cos(ph), R*Math.cos(th), R*Math.sin(th)*Math.sin(ph)]);
    }
  }
  for(i=0;i<LAT;i++){
    for(j=0;j<LON;j++){
      var a=i*LON+j, b=i*LON+(j+1)%LON, c=(i+1)*LON+(j+1)%LON, d=(i+1)*LON+j;
      faces.push([a,d,c,b]);
    }
  }
  // faceted, so there is no exact analytic volume to check against
  return {verts:verts, faces:faces, Vana:null, meta:{kind:"sphere", lat:LAT, lon:LON}};
}

/* ---- assemble, normalise volume, respect the container ---- */
function rawBody(){
  if(S.fam==="sphere")   return buildSphere();
  if(S.fam==="ring")     return buildRingCup();
  if(S.fam==="star")     return buildPrismatic(polyStar());
  if(S.fam==="branch")   return buildPrismatic(polyBranch());
  if(S.fam==="stair")    return buildPrismatic(polyStair());
  if(S.fam==="dumbbell") return buildDumbbell();
  return buildFrustum();
}
function build(){
  var g=rawBody(), verts=g.verts, faces=g.faces, i, d;

  var lo=[1e18,1e18,1e18], hi=[-1e18,-1e18,-1e18];
  for(i=0;i<verts.length;i++) for(d=0;d<3;d++){
    if(verts[i][d]<lo[d]) lo[d]=verts[i][d];
    if(verts[i][d]>hi[d]) hi[d]=verts[i][d];
  }
  var raw=[hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]];
  var ctr=[(hi[0]+lo[0])/2,(hi[1]+lo[1])/2,(hi[2]+lo[2])/2];

  // fill ratio is invariant under anisotropic scaling, so it can be read off
  // the unit body and used to solve for the scale that hits the target volume.
  // This holds for any closed mesh, so the same solve serves every family.
  var rawV = meshVolume({verts:verts, faces:faces});
  var fill = rawV/Math.max(1e-12, raw[0]*raw[1]*raw[2]);
  var check = (g.Vana && g.Vana>1e-12) ? rawV/g.Vana : null;

  // three ratios normalised to unit product: proportion only, no volume change
  var r=[Math.max(1e-6,S.rx), Math.max(1e-6,S.ry), Math.max(1e-6,S.rz)];
  var gm=Math.pow(r[0]*r[1]*r[2], 1/3);
  var nrm=[r[0]/gm, r[1]/gm, r[2]/gm];
  var mx=Math.max(nrm[0], nrm[1], nrm[2]);

  // longest bbox edge is L * (1/fill)^(1/3) * max(nrm), so the largest L whose
  // body still fits an axis-aligned container of side C is:
  var Lmax = S.container * Math.pow(fill, 1/3) / mx;

  // Every thinnest-feature formula is linear in the extents and the extents are
  // linear in L, so evaluating once at L=1 gives the exact L needed to reach the
  // minimum printable feature size. L therefore has a floor as well as a ceiling.
  var kR = Math.pow(Math.max(1e-9, 1/fill), 1/3);
  var thinPerL = thinnest([kR*nrm[0], kR*nrm[1], kR*nrm[2]]);
  var Lmin = (thinPerL > 1e-12) ? S.minfeat/thinPerL : Infinity;

  var Lset = S.cube, L, clamped = false, infeasible = false;
  if(Lmin > Lmax + 1e-9){
    // no size satisfies both: too thin to print before it is small enough to fit
    infeasible = true;
  }
  // 2026-08-30: NO auto-clamp. The requested L is used as-is so the view
  // shows the true size; "clamped" now flags "outside the printable range
  // [Lmin, Lmax]" instead of "was silently adjusted".
  L = Lset;
  clamped = (L < Lmin - 1e-9) || (L > Lmax + 1e-9);

  var k=Math.pow(Math.max(1e-9, L*L*L/fill), 1/3);
  var target=[k*nrm[0], k*nrm[1], k*nrm[2]], sc=[1,1,1];
  for(d=0;d<3;d++) sc[d] = (raw[d] > 1e-9) ? target[d]/raw[d] : 1;
  for(i=0;i<verts.length;i++) for(d=0;d<3;d++) verts[i][d]=(verts[i][d]-ctr[d])*sc[d];

  return {verts:verts, faces:faces, ext:target, meta:g.meta||null,
          fill:fill, check:check, Lmax:Lmax, Lmin:Lmin, Lset:Lset, L:L,
          clamped:clamped, infeasible:infeasible};
}

// signed volume of closed mesh via tetra fan, faces may be polygons
function meshVolume(g){
  var V=0, f, j, a, b, c;
  for(f=0;f<g.faces.length;f++){
    var poly=g.faces[f];
    for(j=1;j<poly.length-1;j++){
      a=g.verts[poly[0]]; b=g.verts[poly[j]]; c=g.verts[poly[j+1]];
      V += (a[0]*(b[1]*c[2]-b[2]*c[1]) - a[1]*(b[0]*c[2]-b[2]*c[0]) + a[2]*(b[0]*c[1]-b[1]*c[0]))/6;
    }
  }
  return Math.abs(V);
}

/* ============ metrics ============ */
/* The bounding box width min(X,Z) is an upper bound on a polygon's true minimum
   width, and they coincide only when the narrowest direction happens to line up
   with an axis. Two things break that alignment: polyNgon's pi/N start offset
   (odd n, and n = 2 mod 4, put the narrowest direction on a diagonal), and the
   anisotropic scaling build() applies to hit a target bounding box, which shears
   a regular polygon into an irregular one. Using min(X,Z) therefore overstates
   wall, neck and core thickness, in the unsafe direction, on most edge counts.
   These helpers measure the section itself instead. */
function scaleSection(poly, ext){
  var lo=[1e18,1e18], hi=[-1e18,-1e18], i;
  for(i=0;i<poly.length;i++){
    if(poly[i][0]<lo[0]) lo[0]=poly[i][0];
    if(poly[i][0]>hi[0]) hi[0]=poly[i][0];
    if(poly[i][1]<lo[1]) lo[1]=poly[i][1];
    if(poly[i][1]>hi[1]) hi[1]=poly[i][1];
  }
  var sx=(hi[0]-lo[0]>1e-12) ? ext[0]/(hi[0]-lo[0]) : 1;
  var sz=(hi[1]-lo[1]>1e-12) ? ext[2]/(hi[1]-lo[1]) : 1;
  var out=[];
  for(i=0;i<poly.length;i++) out.push([poly[i][0]*sx, poly[i][1]*sz]);
  return out;
}
// minimum width of a convex polygon: the narrowest slab that still contains it,
// which is always achieved perpendicular to one of its edges
function polyMinWidth(poly){
  var n=poly.length, best=1e18, i, j;
  for(i=0;i<n;i++){
    var a=poly[i], b=poly[(i+1)%n];
    var ex=b[0]-a[0], ez=b[1]-a[1], L=Math.hypot(ex,ez);
    if(L<1e-12) continue;
    var nx=-ez/L, nz=ex/L, lo=1e18, hi=-1e18;
    for(j=0;j<n;j++){ var t=poly[j][0]*nx+poly[j][1]*nz; if(t<lo)lo=t; if(t>hi)hi=t; }
    if(hi-lo<best) best=hi-lo;
  }
  return best;
}
// smallest distance from the centre to an edge. For two concentric similar
// polygons scaled by q, the wall between them is thinnest across this edge and
// measures (1-q) times this value.
function polyMinApothem(poly){
  var n=poly.length, best=1e18, i;
  for(i=0;i<n;i++){
    var a=poly[i], b=poly[(i+1)%n];
    var ex=b[0]-a[0], ez=b[1]-a[1], L=Math.hypot(ex,ez);
    if(L<1e-12) continue;
    var d=Math.abs(a[0]*(-ez/L) + a[1]*(ex/L));
    if(d<best) best=d;
  }
  return best;
}
function ngonSection(ext){ return scaleSection(orient(cleanPoly(polyNgon())), ext); }
/* The star's inward vertices bound its solid core; the arms taper to tips and
   tips are deliberately excluded (see README). Only meaningful while the
   section is concave: at rin >= cos(pi/K) there is no core, because there are
   no arms springing from one, and this returns a polygon the shape does not
   have. Callers must test convexity first — thinnest() does. */
function starCoreSection(ext){
  var K=starPoints(), ri=starInner(), core=[], j;
  for(j=0;j<K;j++){
    var a=Math.PI/(2*K) + Math.PI*(2*j+1)/K;
    core.push([0.5*ri*Math.cos(a), 0.5*ri*Math.sin(a)]);
  }
  var full=orient(cleanPoly(polyStar()));
  var lo=[1e18,1e18], hi=[-1e18,-1e18];
  for(j=0;j<full.length;j++){
    if(full[j][0]<lo[0]) lo[0]=full[j][0];
    if(full[j][0]>hi[0]) hi[0]=full[j][0];
    if(full[j][1]<lo[1]) lo[1]=full[j][1];
    if(full[j][1]>hi[1]) hi[1]=full[j][1];
  }
  var sx=ext[0]/(hi[0]-lo[0]), sz=ext[2]/(hi[1]-lo[1]), out=[];
  for(j=0;j<core.length;j++) out.push([core[j][0]*sx, core[j][1]*sz]);
  return out;
}
// thinnest printable feature, in mm. Per-family closed form on the scaled bbox.
function thinnest(ext){
  var X=ext[0], Y=ext[1], Z=ext[2];
  if(S.fam==="ring"){
    var th=Math.min((1-boreRatio())*polyMinApothem(ngonSection(ext)), Y);
    if(!boreThrough()) th=Math.min(th, (1-boreDepth())*Y);   // floor left under the bore
    return th;
  }
  if(S.fam==="frustum"){
    // An apex at either end prints fine, so the end faces must not enter this
    // estimate: profileExtremes() spans the whole profile including both ends,
    // so at top=0 its minimum is the apex's zero and the result collapses to 0
    // regardless of how thick the waist actually is. Measure the waist against
    // the profile's widest point directly instead.
    var secW=polyMinWidth(ngonSection(ext));
    var th2=Math.min(secW, Y);
    if(hasWaist() && waistInterior() && waistRatio()<1){
      var wide=Math.max(profileScale(-0.5), profileScale(0.5), waistScale());
      th2=Math.min(th2, (waistScale()/Math.max(1e-6,wide))*secW);
    }
    return th2;
  }
  if(S.fam==="branch")   return Math.min(branchTs()*X, branchTa()*Z, Y);
  if(S.fam==="stair")    return Math.min(X/stairSteps(), Z/stairSteps(), Y);
  if(S.fam==="star"){
    // The core is the right thing to measure only while the section is concave:
    // there the arms are tips, excluded by the rule above, and the core is the
    // bridge carrying them. Once rin reaches cos(pi/K) the section turns convex,
    // with no notches, no arms and so no tips to exclude — measuring the inward
    // polygon then measures a proxy for a feature that is not there. At
    // rin = cos(pi/K) exactly the inward vertices become collinear with their
    // neighbours and cleanPoly drops them, leaving a plain K-gon whose narrowest
    // width is the whole section's.
    var K=starPoints(), sec;
    if(starInner() >= Math.cos(Math.PI/K) - 1e-12) sec=scaleSection(orient(cleanPoly(polyStar())), ext);
    else sec=starCoreSection(ext);
    return Math.min(polyMinWidth(sec), Y);
  }
  if(S.fam==="dumbbell") return Math.min(neckRatio()*polyMinWidth(ngonSection(ext)), Y*2*neckHalf());
  return Math.min(X,Y,Z);
}
function metrics(g){
  var sorted = g.ext.slice().sort(function(p,q){return q-p;});
  var a=sorted[0], b=sorted[1], c=sorted[2];
  var V = meshVolume(g);                 // mm^3
  var f = V/(a*b*c);
  var mass = V/1000 * S.dens;            // cm^3 * g/cm^3
  return {a:a,b:b,c:c,x:g.ext[0],y:g.ext[1],z:g.ext[2],V:V,f:f,mass:mass,
          elong:a/b, flat:b/c, maxdim:a,
          Lmax:g.Lmax, Lmin:g.Lmin, Lset:g.Lset, L:g.L,
          clamped:g.clamped, infeasible:g.infeasible,
          check:g.check, thin:thinnest(g.ext)};
}
/* ============ renderer ============ */
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var W=0,H=0,DPR=1;
var rotX=-0.38, rotY=0.62, dragging=false, lastX=0, lastY=0, spin=0;

function resize(){
  var r=cv.parentNode.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,Math.floor(r.width)); H=Math.max(1,Math.floor(r.height));
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);

cv.addEventListener("pointerdown",function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",function(e){
  if(!dragging)return;
  rotY += (e.clientX-lastX)*0.008;
  rotX += (e.clientY-lastY)*0.008;
  rotX = Math.max(-1.45, Math.min(1.45, rotX));
  lastX=e.clientX; lastY=e.clientY;
});
cv.addEventListener("pointerup",function(e){dragging=false;});
cv.addEventListener("pointercancel",function(){dragging=false;});

function rot(p, rx, ry){
  var cy=Math.cos(ry), sy=Math.sin(ry);
  var x=p[0]*cy + p[2]*sy, z=-p[0]*sy + p[2]*cy, y=p[1];
  var cx=Math.cos(rx), sx=Math.sin(rx);
  var y2=y*cx - z*sx, z2=y*sx + z*cx;
  return [x,y2,z2];
}

var geo=null, met=null;

function project(p, scale){
  var d=520, z=p[2]+d;
  var k=(d/Math.max(60,z))*scale;
  return [W/2 + p[0]*k, H/2 - p[1]*k, p[2]];
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(!geo){return;}
  var ry = rotY + (dragging||reduceMotion ? 0 : spin);
  var basisL = met ? met.L : S.cube;
  var fitSpan = Math.max(geo.ext[0],geo.ext[1],geo.ext[2],basisL);
  if(showCont) fitSpan = Math.max(fitSpan, S.container);
  var scale = Math.min(W,H)/ (fitSpan * 2.5);

  // transform verts
  var tv=[], i;
  for(i=0;i<geo.verts.length;i++) tv.push(rot(geo.verts[i], rotX, ry));
  var pv=[];
  for(i=0;i<tv.length;i++) pv.push(project(tv[i], scale));

  /* bounding box (signature: drafting dimension frame) */
  var e=geo.ext, hx=e[0]/2, hy=e[1]/2, hz=e[2]/2;
  var corners=[], sx,sy,sz;
  for(sx=-1;sx<=1;sx+=2)for(sy=-1;sy<=1;sy+=2)for(sz=-1;sz<=1;sz+=2)
    corners.push(project(rot([sx*hx,sy*hy,sz*hz],rotX,ry), scale));
  function ci(x,y,z){ return ((x>0?1:0)*4)+((y>0?1:0)*2)+((z>0?1:0)); }
  var boxEdges=[];
  var signs=[-1,1];
  for(var ai=0;ai<2;ai++)for(var bi=0;bi<2;bi++){
    boxEdges.push([ci(-1,signs[ai],signs[bi]), ci(1,signs[ai],signs[bi]), 0]);
    boxEdges.push([ci(signs[ai],-1,signs[bi]), ci(signs[ai],1,signs[bi]), 1]);
    boxEdges.push([ci(signs[ai],signs[bi],-1), ci(signs[ai],signs[bi],1), 2]);
  }
  /* container: the body is guaranteed to fit inside this axis-aligned cube */
  if(showCont){
    var chh=S.container/2, ccor=[];
    for(sx=-1;sx<=1;sx+=2)for(sy=-1;sy<=1;sy+=2)for(sz=-1;sz<=1;sz+=2)
      ccor.push(project(rot([sx*chh,sy*chh,sz*chh],rotX,ry), scale));
    ctx.save();
    ctx.lineWidth=1;
    ctx.strokeStyle="rgba(95,180,210,0.55)";
    for(i=0;i<boxEdges.length;i++){
      var Ac=ccor[boxEdges[i][0]], Bc=ccor[boxEdges[i][1]];
      ctx.beginPath(); ctx.moveTo(Ac[0],Ac[1]); ctx.lineTo(Bc[0],Bc[1]); ctx.stroke();
    }
    ctx.restore();
  }

  /* basis cube: every body is scaled to this cube's volume */
  var bh=basisL/2, bcor=[];
  for(sx=-1;sx<=1;sx+=2)for(sy=-1;sy<=1;sy+=2)for(sz=-1;sz<=1;sz+=2)
    bcor.push(project(rot([sx*bh,sy*bh,sz*bh],rotX,ry), scale));
  ctx.save();
  ctx.lineWidth=1;
  ctx.strokeStyle="rgba(233,161,59,0.34)";
  for(i=0;i<boxEdges.length;i++){
    var Ab=bcor[boxEdges[i][0]], Bb=bcor[boxEdges[i][1]];
    ctx.beginPath(); ctx.moveTo(Ab[0],Ab[1]); ctx.lineTo(Bb[0],Bb[1]); ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.setLineDash([3,4]);
  ctx.lineWidth=1;
  ctx.strokeStyle="rgba(120,138,150,0.32)";
  for(i=0;i<boxEdges.length;i++){
    var A=corners[boxEdges[i][0]], B=corners[boxEdges[i][1]];
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  }
  ctx.restore();

  /* solid: build() winds every face so the Newell normal points into the
     material, so the outward normal is its negation for all families. Cull
     back faces, then paint far to near: the ring is not convex, and its far
     wall is visible through the hole. */
  var CAMZ = -520;                       // camera sits on -z, +z runs away from viewer
  var L=[-0.40,0.70,-0.58];
  var Ln=Math.sqrt(L[0]*L[0]+L[1]*L[1]+L[2]*L[2]);
  L=[L[0]/Ln,L[1]/Ln,L[2]/Ln];
  // draw facet outlines only when the mesh is coarse enough for them to read
  var showEdges = geo.faces.length <= 220;

  var vis=[];
  for(var fi=0;fi<geo.faces.length;fi++){
    var p2=geo.faces[fi], np=p2.length, kk;

    // Newell's method: robust for polygons that degenerate (e.g. sphere poles)
    var nx=0, ny=0, nz=0, cx=0, cyy=0, cz=0;
    for(kk=0;kk<np;kk++){
      var A3=tv[p2[kk]], B3=tv[p2[(kk+1)%np]];
      nx += (A3[1]-B3[1])*(A3[2]+B3[2]);
      ny += (A3[2]-B3[2])*(A3[0]+B3[0]);
      nz += (A3[0]-B3[0])*(A3[1]+B3[1]);
      cx += A3[0]; cyy += A3[1]; cz += A3[2];
    }
    var nl=Math.sqrt(nx*nx+ny*ny+nz*nz);
    if(nl < 1e-9) continue;
    nx=-nx/nl; ny=-ny/nl; nz=-nz/nl;
    cx/=np; cyy/=np; cz/=np;

    // perspective back-face cull: is the camera on the outward side?
    if(nx*(0-cx) + ny*(0-cyy) + nz*(CAMZ-cz) <= 0) continue;

    var lam=Math.max(0, nx*L[0]+ny*L[1]+nz*L[2]);
    vis.push({p:p2, d:cz, lum:0.24+0.76*Math.pow(lam,0.8)});
  }
  vis.sort(function(a,b){return b.d-a.d;});

  for(var vi=0;vi<vis.length;vi++){
    var pf=vis[vi].p, lum=vis[vi].lum;
    var r=Math.round(80+lum*132), g2=Math.round(96+lum*140), b2=Math.round(112+lum*142);
    ctx.beginPath();
    ctx.moveTo(pv[pf[0]][0],pv[pf[0]][1]);
    for(var k2=1;k2<pf.length;k2++) ctx.lineTo(pv[pf[k2]][0],pv[pf[k2]][1]);
    ctx.closePath();
    ctx.fillStyle="rgb("+r+","+g2+","+b2+")";
    ctx.fill();
    if(showEdges){
      ctx.lineWidth=1;
      ctx.strokeStyle="rgba(15,19,23,0.5)";
      ctx.stroke();
    }
  }

  /* dimension labels X / Y / Z on the outermost edge of each axis */
  var letter={0:"X",1:"Y",2:"Z"};
  var pick={0:null,1:null,2:null};
  for(i=0;i<boxEdges.length;i++){
    var ax=boxEdges[i][2], A2=corners[boxEdges[i][0]], B2=corners[boxEdges[i][1]];
    var mid=[(A2[0]+B2[0])/2,(A2[1]+B2[1])/2];
    var score = (ax===1) ? -mid[0] : mid[1];
    if(!pick[ax] || score>pick[ax].score) pick[ax]={score:score, mid:mid, A:A2, B:B2};
  }
  ctx.font="600 11px "+getComputedStyle(document.body).getPropertyValue("--mono");
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(var ax2=0;ax2<3;ax2++){
    var P=pick[ax2]; if(!P) continue;
    var dx=P.B[0]-P.A[0], dy=P.B[1]-P.A[1];

// build() winds every face so the Newell normal points into the material.
// STL wants outward normals, so each fan triangle is emitted reversed.
/* Ear clipping, not a fan. The star, branch and stair cross-sections are
   concave, and a fan from vertex 0 across a concave cap emits overlapping and
   flipped triangles: the volume sum still cancels out correctly, but the STL is
   self-intersecting and a slicer will reject it. Ear clipping tessellates any
   simple polygon properly. Returns triangles wound like the input face. */
function earClip(verts, poly){
  var n=poly.length, k;
  if(n<3) return [];
  if(n===3) return [[poly[0],poly[1],poly[2]]];

  var nx=0, ny=0, nz=0;
  for(k=0;k<n;k++){
    var A=verts[poly[k]], B=verts[poly[(k+1)%n]];
    nx += (A[1]-B[1])*(A[2]+B[2]);
    ny += (A[2]-B[2])*(A[0]+B[0]);
    nz += (A[0]-B[0])*(A[1]+B[1]);

  // drop the dominant axis of the normal, so the projection stays non-degenerate
  var ax=Math.abs(nx), ay=Math.abs(ny), az=Math.abs(nz), i0, i1;
  if(ax>=ay && ax>=az){ i0=1; i1=2; }
  else if(ay>=az){      i0=2; i1=0; }
  else {                i0=0; i1=1; }

  var P=[];
  for(k=0;k<n;k++){ var v=verts[poly[k]]; P.push([v[i0], v[i1]]); }

  var a2=0;
  for(k=0;k<n;k++){ var q=P[k], r=P[(k+1)%n]; a2 += q[0]*r[1]-r[0]*q[1]; }

  function cr(o,b,c){ return (b[0]-o[0])*(c[1]-o[1])-(b[1]-o[1])*(c[0]-o[0]); }

    return cr(q,r,p)>=-1e-12 && cr(r,t,p)>=-1e-12 && cr(t,q,p)>=-1e-12;

}

/* Cut the dumbbell at both neck junctions: two end pieces and the middle rod.

    [capDn(2)].concat(band(2), [capUp(3)]),     // middle rod

    for(j=0;j<verts.length;j++) for(k=0;k<3;k++){

      if(verts[j][k]>hi[k]) hi[k]=verts[j][k];

function mergeParts(parts, gap){

    for(j=0;j<b.verts.length;j++) verts.push([b.verts[j][0]+dx, b.verts[j][1], b.verts[j][2]]);

      faces.push(np);
    }

function stlBuffer(g, name){

  var minz=1e18;

  for(i=0;i<V.length;i++) V[i][2]-=minz;          // rest the body on the plate

  var tri=triangulate(g), keep=[];
  for(i=0;i<tri.length;i++){
    var a=V[tri[i][0]], b=V[tri[i][1]], c=V[tri[i][2]];
    var ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2];
    var wx=c[0]-a[0], wy=c[1]-a[1], wz=c[2]-a[2];
    var nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx;
    var nl=Math.sqrt(nx*nx+ny*ny+nz*nz);

  dv.setUint32(80, keep.length, true);

    var t=keep[i];
    dv.setFloat32(o,t[0],true); dv.setFloat32(o+4,t[1],true); dv.setFloat32(o+8,t[2],true);
    for(var k=0;k<3;k++){

      dv.setFloat32(o+20+k*12, q[2], true);

function nf(v,d){ return Number(v).toFixed(d); }

   different bodies: two rows that differ only in a clamped input both wrote
   frustum_n4_t0.50_m0.02_h0.50_r1.00-1.00-1.00_L30.0 while building different

  else if(o.fam==="ring")     s+="_n"+o.n+"_q"+nf(boreRatio(),2)+"_d"+nf(boreDepth(),2);
  else if(o.fam==="star")     s+="_k"+starPoints()+"_i"+nf(starInner(),2);
  else if(o.fam==="dumbbell") s+="_n"+o.n+"_c"+nf(neckRatio(),2)+"_cl"+nf(2*neckHalf(),2);

    var nm=enc.encode(files[i].name), data=files[i].data, crc=crc32(data);

    d.setUint32(0,0x04034b50,true); d.setUint16(4,20,true); d.setUint16(6,0,true);
    d.setUint16(8,0,true); d.setUint16(10,0,true); d.setUint16(12,0,true);
    d.setUint32(14,crc,true); d.setUint32(18,data.length,true); d.setUint32(22,data.length,true);
    d.setUint16(26,nm.length,true); d.setUint16(28,0,true);

    var ch=new Uint8Array(46+nm.length), e=new DataView(ch.buffer);
    e.setUint32(0,0x02014b50,true); e.setUint16(4,20,true); e.setUint16(6,20,true);
    e.setUint16(8,0,true); e.setUint16(10,0,true); e.setUint16(12,0,true); e.setUint16(14,0,true);
    e.setUint32(16,crc,true); e.setUint32(20,data.length,true); e.setUint32(24,data.length,true);
    e.setUint16(28,nm.length,true); e.setUint16(30,0,true); e.setUint16(32,0,true);
    e.setUint16(34,0,true); e.setUint16(36,0,true); e.setUint32(38,0,true);

  v.setUint32(0,0x06054b50,true); v.setUint16(4,0,true); v.setUint16(6,0,true);
  v.setUint16(8,files.length,true); v.setUint16(10,files.length,true);
  v.setUint32(12,csize,true); v.setUint32(16,off,true); v.setUint16(20,0,true);

function numInput(val,min,max,step,onch){
  var i=document.createElement("input");
  i.type="number"; i.min=min; i.max=max; i.step=step; i.value=val;
  i.onchange=function(){
    var v=parseFloat(i.value);
    if(!isFinite(v)){ i.value=val; return; }        // 非數字：還原
    v=Math.min(max, Math.max(min, v));              // 超出範圍：夾住
    i.value=v; val=v; onch(v);
  };
  return i;
}

  var tag=document.createElement("span"); tag.className="offtag"; tag.textContent="停用";
  function mark(){ var off=!((arr[1]-arr[0])>1e-9);
    box.className = off ? "single off" : "single"; tag.style.display = off ? "" : "none"; }
  function push(){ var x=parseFloat(a.value), y=parseFloat(b.value);
    if(!isNaN(x)) arr[0]=x; if(!isNaN(y)) arr[1]=y; mark(); if(onch) onch(); }
  a.onchange=push; b.onchange=push;

    var box=document.createElement("div");

    var n=document.createElement("p"); n.className="note";
    n.textContent="逗號分隔，circle 代表圓形截面。離散軸不隨層級增減，三層填一樣的內容即可；格數取三層的聯集，不會重複計算。";
    bd.appendChild(n);
  } else if(sp.mode==="bi"){
    row("L0", rngInputs(sp.L0,onch));
    sp.sides.forEach(function(p,i){ row("L"+(i+1), pairRow(p[0], p[1])); });
  } else {
    sp.levels.forEach(function(r,i){ row("L"+i, rngInputs(r,onch)); });
  }
  wrap.appendChild(bd);
  return wrap;
}

function liveRange(a){ return (a && a.length===2 && (a[1]-a[0])>1e-9) ? 1 : 0; }
function levelCount(sp){
  if(sp.mode==="disc"){
    var seen={}, n=0;
    [sp.L0,sp.L1,sp.L2].forEach(function(v){
      String(v).split(",").forEach(function(t){
        t=t.trim(); if(t!=="" && !seen[t]){ seen[t]=1; n++; }
      });
    });
    return n;   // 離散軸不隨層級增減，取三層的聯集
  }
  if(sp.mode==="bi"){
    var n=liveRange(sp.L0);
    sp.sides.forEach(function(p){ n+=liveRange(p[0])+liveRange(p[1]); });
    return n;
  }
  var m=0; sp.levels.forEach(function(r){ m+=liveRange(r); }); return m;
}

    var gs=document.createElement("div"); gs.className="grp";
    gs.innerHTML='<div class="glab">形狀軸</div>';
    for(var i=0;i<L.ax.length;i++){
      var k=L.ax[i][0];
      gs.appendChild(axBlock(P[k]?P[k].lab:k, k, L.ax[i][1], onch));
    }
    host.appendChild(gs);
  }

  var tot=document.createElement("div"); tot.className="tot"; tot.id="tot";
  host.appendChild(tot);
  renderTotals();

  var acts=document.createElement("div"); acts.className="acts";
  var b1=document.createElement("button"); b1.className="prim"; b1.textContent="複製全部層級 JSON";
  b1.onclick=exportJson;
  var b2=document.createElement("button"); b2.textContent="複製全部層級表格";
  b2.onclick=exportMd;
  acts.appendChild(b1); acts.appendChild(b2);
  host.appendChild(acts);
}

function classGrid(id){
  var L=LV[id]; if(!L) return 0;
  var g = levelCount(L.c) * levelCount(L.e);
  for(var i=0;i<L.ax.length;i++) g *= levelCount(L.ax[i][1]);
  return g;
}
function renderTotals(){
  var el=$("tot"); if(!el) return;
  var mine=classGrid(cur.id), all=0;
  for(var i=0;i<CLASSES.length;i++) all += classGrid(CLASSES[i].id);
  var per=[1,2,3,5], t=[];
  for(var j=0;j<per.length;j++) t.push("每格 "+per[j]+" 顆 → "+(all*per[j]));
  var need=(all>0)?(8000/all):0;
  el.innerHTML="這個類別 <b>"+mine+"</b> 格　／　十三類別合計 <b>"+all+"</b> 格<br>"+
    t.join("　·　")+"<br>總數要壓在 8000 顆，每格只能放 <b>"+need.toFixed(1)+"</b> 顆";
}

/* ============ export ============ */
function spOut(sp){
  if(sp.mode==="disc") return {mode:"disc",root:sp.root,L0:sp.L0,L1:sp.L1,L2:sp.L2};
  if(sp.mode==="bi"){
    var o={mode:"bi",root:sp.root,L0:sp.L0};
    sp.sides.forEach(function(p,i){ o["L"+(i+1)]={lo:p[0],hi:p[1]}; });
    o.n_levels=1+sp.sides.length;
    return o;
  }
  var u={mode:"up",root:sp.root};
  sp.levels.forEach(function(r,i){ u["L"+i]=r; });
  u.n_levels=sp.levels.length;
  return u;
}
function exportJson(){
  var o={classes:{}};
  for(var i=0;i<CLASSES.length;i++){
    var c=CLASSES[i], L=LV[c.id];
    var ax={};
    for(var j=0;j<L.ax.length;j++) ax[L.ax[j][0]]=spOut(L.ax[j][1]);
    o.classes[c.id]={name:c.name,fam:c.fam,fix:c.fix,
      c:spOut(L.c),e:spOut(L.e),axes:ax,grid:classGrid(c.id)};
  }
  var tot=0; for(i=0;i<CLASSES.length;i++) tot+=classGrid(CLASSES[i].id);
  o.total_grid=tot;
  copy(JSON.stringify(o,null,2),"層級 JSON 已複製");
}
function rngTxt(a){ return liveRange(a) ? (a[0]+" – "+a[1]) : "—"; }
function nLevels(sp){
  if(sp.mode==="disc") return 3;
  if(sp.mode==="bi") return 1+sp.sides.length;
  return sp.levels.length;
}
function lvTxt(sp,i){
  if(sp.mode==="disc") return i<3 ? sp[["L0","L1","L2"][i]] : "";
  if(sp.mode==="bi"){
    if(i===0) return rngTxt(sp.L0);
    var p=sp.sides[i-1]; if(!p) return "";
    var lo=rngTxt(p[0]), hi=rngTxt(p[1]);
    if(lo==="—" && hi==="—") return "—";
    if(lo==="—") return hi;
    if(hi==="—") return lo;
    return lo+" ／ "+hi;
  }
  var r=sp.levels[i]; return r ? rngTxt(r) : "";
}
function exportMd(){
  var i,j,r,c,L,rows,maxL=0;
  for(i=0;i<CLASSES.length;i++){
    L=LV[CLASSES[i].id];
    maxL=Math.max(maxL, nLevels(L.c), nLevels(L.e));
    for(j=0;j<L.ax.length;j++) maxL=Math.max(maxL, nLevels(L.ax[j][1]));
  }
  var head="| 類別 | fam | 軸 | root", sep="| --- | --- | --- | ---";
  for(i=0;i<maxL;i++){ head+=" | L"+i; sep+=" | ---"; }
  var out=[head+" | 格數 |", sep+" | --- |"];
  for(i=0;i<CLASSES.length;i++){
    c=CLASSES[i]; L=LV[c.id];
    rows=[["c (c)",L.c],["e (e)",L.e]];
    for(j=0;j<L.ax.length;j++) rows.push([(P[L.ax[j][0]]?P[L.ax[j][0]].lab:L.ax[j][0])+" ("+L.ax[j][0]+")", L.ax[j][1]]);
    for(r=0;r<rows.length;r++){
      var line="| "+(r===0?c.name:"")+" | "+(r===0?c.fam:"")+" | "+rows[r][0]+" | "+rows[r][1].root;
      for(j=0;j<maxL;j++) line+=" | "+(lvTxt(rows[r][1],j)||"");
      line+=" | "+(r===0?classGrid(c.id):"")+" |";
      out.push(line);
    }
  }
  var tot=0; for(i=0;i<CLASSES.length;i++) tot+=classGrid(CLASSES[i].id);
  out.push(""); out.push("合計 "+tot+" 格。");
  copy(out.join("\n"),"層級表格已複製");
}

/* ============ readout ============ */
function cellHtml(k,v,cls){
  return '<div class="cell"><div class="k">'+k+'</div><div class="v'+(cls?" "+cls:"")+'">'+v+'</div></div>';
}
function update(){
  geo=build(); met=metrics(geo);
  if(!isFinite(met.L) || !isFinite(met.thin) || !isFinite(met.x)){
    $("strip").innerHTML=cellHtml("狀態","參數超出可計算範圍，請調回合理值","warn");
    $("flag").className="flag warn on";
    $("flag").textContent="幾何計算失敗";
    return;
  }
  var sorted=[met.x,met.y,met.z].slice().sort(function(a,b){return b-a;});
  var span=sorted[0]/Math.max(1e-9,sorted[2]);
  var thin=met.thin, bad=thin<S.minfeat-1e-9;
  $("strip").innerHTML=
    cellHtml("尺寸 X·Y·Z mm", met.x.toFixed(1)+" · "+met.y.toFixed(1)+" · "+met.z.toFixed(1))+
    cellHtml("最長 : 最短", span.toFixed(2), span>5.001?"warn":"")+
    cellHtml("c 截面", cval.toFixed(2))+
    cellHtml("e 擠出", eval_.toFixed(2))+
    cellHtml("L 採用 mm", met.L.toFixed(1)+(met.clamped?" ✳":""), met.clamped?"warn":"")+
    cellHtml("L 可用範圍 mm",
      (isFinite(met.Lmin)?met.Lmin.toFixed(1):"—")+" – "+met.Lmax.toFixed(1),
      (met.Lmin>met.Lmax+1e-9)?"warn":"")+
    cellHtml("最薄特徵 mm", thin.toFixed(2), bad?"warn":"ok")+
    (cur.fam==="frustum"
      ? cellHtml("腰 設定 → 採用",
          Number(S.waist).toFixed(2)+" → "+waistRatio().toFixed(2),
          (Math.abs(waistRatio()-S.waist)>1e-6)?"warn":"")
      : "");
  $("badge").innerHTML="<b>"+cur.name+"</b>　"+cur.fam;
  var fl=$("flag");
  if(met.infeasible){ fl.className="flag warn on"; fl.textContent="印不出來：所需最小尺寸已超過容器"; }
  else if(bad){ fl.className="flag warn on"; fl.textContent="最薄特徵低於 "+S.minfeat+" mm"; }
  else { fl.className="flag warn"; }
}

/* ============ shell ============ */
function renderAll(){
  renderRail();
  $("ptitle").textContent = cur.name;
  $("pfam").textContent   = cur.fam;
  $("pdesc").textContent  = cur.desc;
  renderParams(); renderLevels();
}
$("tab1").onclick=function(){ tab=1; setTab(); };
$("tab2").onclick=function(){ tab=2; setTab(); };
function setTab(){
  $("tab1").setAttribute("aria-selected", tab===1?"true":"false");
  $("tab2").setAttribute("aria-selected", tab===2?"true":"false");
  $("body1").hidden = tab!==1; $("body2").hidden = tab!==2;
}
$("viewopt").onclick=function(ev){
  var b=ev.target.closest("button"); if(!b) return;
  var k=b.getAttribute("data-k");
  if(k==="cont"){ showCont=!showCont; b.setAttribute("aria-pressed", showCont?"true":"false"); }
  else if(k==="spin"){ autoSpin=!autoSpin; reduceMotion=!autoSpin;
                       b.setAttribute("aria-pressed", autoSpin?"true":"false"); }
};

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.className="toast on";
  setTimeout(function(){ t.className="toast"; },1500);
}
function copy(txt,label){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(label);},function(){fb(txt,label);});
  } else fb(txt,label);
}
function fb(txt,label){
  var ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(label); }catch(e){ toast("複製失敗，請手動選取"); }
  document.body.removeChild(ta);
}

resize(); setTab(); loadClass(CLASSES[0]); loop();

})();
</script>
